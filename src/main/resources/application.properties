spring.application.name=imovel-Facil
server.port=8080
server.address=${SERVER_ADDRESS:127.0.0.1}
server.forward-headers-strategy=none
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
spring.datasource.url=jdbc:h2:mem:imovelfacil;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.h2.console.enabled=false
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=100
spring.jackson.factory.constraints.read.max-document-length=65536
spring.jackson.factory.constraints.read.max-name-length=128
spring.jackson.factory.constraints.read.max-string-length=4096
spring.jackson.factory.constraints.read.max-number-length=32
spring.jackson.factory.constraints.read.max-nesting-depth=10
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.datatype.enum.fail-on-numbers-for-enums=true
spring.cache.type=caffeine
spring.cache.cache-names=properties
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=10m,recordStats
management.endpoints.web.exposure.include=health,info,caches
management.endpoints.web.discovery.enabled=false
management.endpoints.access.default=none
management.endpoint.health.access=read-only
management.endpoint.info.access=read-only
management.endpoint.caches.access=read-only
management.endpoint.health.show-details=never
management.info.env.enabled=true
info.app.name=Im\u00f3vel F\u00e1cil API
info.app.version=1.0.0
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.show-actuator=false
app.seed.enabled=true
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:[*],http://127.0.0.1:[*]}
